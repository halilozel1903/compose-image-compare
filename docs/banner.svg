<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="compose-image-compare: before and after image comparison for Jetpack Compose" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14204A"/>
      <stop offset="1" stop-color="#2B4FB5"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3F86D1"/>
      <stop offset="1" stop-color="#DCECF7"/>
    </linearGradient>
    <linearGradient id="skyGray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A7A7A"/>
      <stop offset="1" stop-color="#E6E6E6"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4E7FA3"/>
      <stop offset="1" stop-color="#2F5F7F"/>
    </linearGradient>
    <linearGradient id="lakeGray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7B7B7B"/>
      <stop offset="1" stop-color="#555555"/>
    </linearGradient>
    <clipPath id="screen"><rect x="842" y="78" width="268" height="404" rx="26"/></clipPath>
    <clipPath id="left"><rect x="842" y="78" width="134" height="404"/></clipPath>
    <clipPath id="right"><rect x="976" y="78" width="134" height="404"/></clipPath>
    <clipPath id="tile"><rect x="1078" y="300" width="150" height="150" rx="75"/></clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#060B1E" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1280" height="560" fill="url(#bg)"/>
  <circle cx="1180" cy="40" r="220" fill="#FFFFFF" opacity="0.05"/>
  <circle cx="60" cy="560" r="170" fill="#7FB3FF" opacity="0.08"/>

  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="80" y="150" fill="#9CC2FF" font-size="22" font-weight="700" letter-spacing="3">JETPACK COMPOSE · ANDROID</text>
    <text x="80" y="218" fill="#FFFFFF" font-size="48" font-weight="800">compose-image-compare</text>
    <text x="80" y="270" fill="#DCE6FF" font-size="25">Before and after image comparison: drag slider,</text>
    <text x="80" y="304" fill="#DCE6FF" font-size="25">vertical or horizontal split, zoom and labels.</text>
    <g font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">
      <rect x="80" y="350" width="137" height="40" rx="20" fill="#FFFFFF" opacity="0.15"/>
      <text x="148" y="375">Drag slider</text>
      <rect x="229" y="350" width="229" height="40" rx="20" fill="#FFFFFF" opacity="0.15"/>
      <text x="344" y="375">Horizontal · Vertical</text>
      <rect x="470" y="350" width="155" height="40" rx="20" fill="#FFFFFF" opacity="0.15"/>
      <text x="548" y="375">Pinch to zoom</text>
      <rect x="637" y="350" width="91" height="40" rx="20" fill="#FFFFFF" opacity="0.15"/>
      <text x="682" y="375">Labels</text>
      <rect x="80" y="402" width="118" height="40" rx="20" fill="#FFFFFF" opacity="0.15"/>
      <text x="139" y="427">Fade mode</text>
      <rect x="210" y="402" width="210" height="40" rx="20" fill="#FFFFFF" opacity="0.15"/>
      <text x="315" y="427">Keyboard &amp; TalkBack</text>
      <rect x="432" y="402" width="164" height="40" rx="20" fill="#FFFFFF" opacity="0.15"/>
      <text x="514" y="427">Phone &amp; tablet</text>
    </g>
  </g>

  <!-- Phone -->
  <g filter="url(#shadow)">
    <rect x="826" y="62" width="300" height="436" rx="38" fill="#0E1328"/>
  </g>
  <g clip-path="url(#screen)">
    <!-- Before: color -->
    <g clip-path="url(#left)">
      <rect x="842" y="78" width="268" height="260" fill="url(#sky)"/>
      <circle cx="1060" cy="140" r="20" fill="#FFF8E6"/>
      <polygon points="842,300 900,214 940,262 990,180 1050,262 1110,226 1110,300" fill="#6F86A8"/>
      <polygon points="975,196 990,180 1006,198 994,192 984,202" fill="#F4F6FB"/>
      <polygon points="842,300 880,284 930,292 990,280 1050,290 1110,282 1110,320 842,320" fill="#3E5B5A"/>
      <rect x="842" y="318" width="268" height="164" fill="url(#lake)"/>
      <polygon points="842,318 900,404 940,356 990,438 1050,356 1110,392 1110,318" fill="#5F7898" opacity="0.6"/>
    </g>
    <!-- After: monochrome -->
    <g clip-path="url(#right)">
      <rect x="842" y="78" width="268" height="260" fill="url(#skyGray)"/>
      <circle cx="1060" cy="140" r="20" fill="#F5F5F5"/>
      <polygon points="842,300 900,214 940,262 990,180 1050,262 1110,226 1110,300" fill="#8A8A8A"/>
      <polygon points="975,196 990,180 1006,198 994,192 984,202" fill="#F4F4F4"/>
      <polygon points="842,300 880,284 930,292 990,280 1050,290 1110,282 1110,320 842,320" fill="#555555"/>
      <rect x="842" y="318" width="268" height="164" fill="url(#lakeGray)"/>
      <polygon points="842,318 900,404 940,356 990,438 1050,356 1110,392 1110,318" fill="#7C7C7C" opacity="0.6"/>
    </g>
    <!-- Labels -->
    <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">
      <rect x="854" y="96" width="74" height="26" rx="13" fill="#000000" opacity="0.55"/>
      <text x="891" y="114" text-anchor="middle">Before</text>
      <rect x="1034" y="96" width="64" height="26" rx="13" fill="#000000" opacity="0.55"/>
      <text x="1066" y="114" text-anchor="middle">After</text>
    </g>
    <!-- Divider and handle -->
    <rect x="975" y="78" width="3" height="404" fill="#FFFFFF"/>
    <circle cx="976" cy="280" r="22" fill="#FFFFFF"/>
    <path d="M968 272 L960 280 L968 288 M984 272 L992 280 L984 288" fill="none" stroke="#1F2430" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="936" y="70" width="80" height="6" rx="3" fill="#2A3150"/>

  <!-- Zoom lens -->
  <g filter="url(#shadow)">
    <circle cx="1153" cy="375" r="83" fill="#FFFFFF"/>
  </g>
  <g clip-path="url(#tile)">
    <rect x="1078" y="300" width="75" height="150" fill="#6F86A8"/>
    <rect x="1153" y="300" width="75" height="150" fill="#8A8A8A"/>
    <polygon points="1078,300 1153,300 1153,340 1120,380 1078,350" fill="#3F86D1"/>
    <polygon points="1153,300 1228,300 1228,350 1186,380 1153,340" fill="#9A9A9A"/>
    <polygon points="1120,380 1153,340 1153,400 1110,420" fill="#F4F6FB"/>
    <polygon points="1153,340 1186,380 1196,420 1153,400" fill="#F4F4F4"/>
    <rect x="1078" y="420" width="75" height="30" fill="#3E5B5A"/>
    <rect x="1153" y="420" width="75" height="30" fill="#555555"/>
    <rect x="1151" y="300" width="4" height="150" fill="#FFFFFF"/>
  </g>
  <circle cx="1153" cy="375" r="75" fill="none" stroke="#FFFFFF" stroke-width="8"/>
  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="1118" y="440" width="70" height="28" rx="14" fill="#2B5BD7"/>
    <text x="1153" y="459" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">2.5x</text>
  </g>
</svg>
